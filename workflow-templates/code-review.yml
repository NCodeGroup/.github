name: Code review

# NCodeGroup's workflow template for NCode Review, for a repository that isn't made from the project template
# (https://github.com/NCodeGroup/project-template), which gives its projects this same caller. It is the template's
# .github/workflows/code-review.yml, with these comments in place of the template's: everything below `on:` is the
# same, and NCodeGroup/.github's workflow-templates/README.md says how the two are kept in step.
#
# Reviews each pull request with NCode Review (NCodeGroup/code-review), which posts as ncode-review[bot]: a
# "Code review" check run, a summary comment with a verdict, and inline threads. Its findings are advice, and nothing
# requires its check run; its approval is another matter, below. It reviews a pull request when it opens (drafts
# included, since that's when its author reviews it, except a fork's, which waits until it's ready, below) and when it's
# marked ready, unless that commit was already reviewed; pushes in between start nothing, except Dependabot's to its own
# pull request, which it reviews when it opens and after each push Dependabot makes, such as a rebase. Another bot's
# pull request waits for a /review. A top-level comment from someone with write access whose first line is `/review`
# reviews the latest commit on demand, also with a footer below it, such as an agent's `---` line and attribution, which
# NCode Review sets aside; `/review explain F3` says whether a finding still holds, and `/review teach <rule>` files a
# rule as an issue, both on a closed pull request too. A `skip-review` label skips the automatic reviews. When a pull
# request closes, merged or not, the outcomes job only records each posted finding's outcome, with no model call. The
# NCode Review app's key is an organization secret. The code-review environment, which only the default branch can
# deploy to, holds the approver's key, NCODE_REVIEW_APPROVER_PRIVATE_KEY, once it is stored, and lets Anthropic's
# federation rule trust the review job.
#
# approve: true approves a pull request whose review leaves no blocker or should-fix finding open. GitHub counts an
# approval toward a ruleset's required approval only from a reviewer that can write, so the approval is submitted by the
# NCode Review Approver, an app with Contents: write whose token, minted after the review, can only write pull requests.
# Without its key, NCode Review's own app approves, which meets no required approval. A push dismisses the approval, so
# comment /review after one. Dependabot's own pushes start a review, so a clean review approves Dependabot's pull
# requests; a maintainer approves another bot's pull request, or comments /review on it. The project template's
# ADR-0022, ADR-0036 and ADR-0041 say why:
# https://github.com/NCodeGroup/project-template/tree/main/template/docs/decisions/project-template
#
# review-forks: true reviews a pull request from a fork too: when it opens or reopens as ready for review, when it's
# marked ready and on a writer's /review, never as a draft when it opens, and never as an approval, so a maintainer
# approves it. Its closing records its outcomes. To leave forks out, drop review-forks from both steps, put
# `github.event.pull_request.head.repo.full_name == github.repository &&` back in place of the review job's fork line,
# and add `&& github.event.pull_request.head.repo.full_name == github.repository` to the end of the outcomes job's if:.
# The project template's ADR-0043 says why.
#
# pull_request_target and issue_comment both run this file from the default branch, so a pull request can't change its
# own review. The engine fetches its code only to read it: nothing from it is built, run or installed.
#
# Set up once, for this repository:
# - From a clone of NCodeGroup/code-review, run tools/Enable-CodeReview.ps1 -Repo <name>. It creates the code-review
#   environment, which only the default branch can deploy to, and gives the repository access to the organization's two
#   secrets; add -ApproverPrivateKeyPath <the approver's .pem> to store the approver's key there, then delete the .pem.
# - Add the repository to both apps' installations, NCode Review and NCode Review Approver.
# - In a public repository, GitHub runs pull_request_target from December 2, 2026 only where an event policy allows
#   it; the project template's tools/Set-RepositoryBaseline.ps1 creates it.
# - This file is a one-time copy, so keep its pin current: add a github-actions entry to .github/dependabot.yml, which
#   opens a pull request for each new release and updates the SHA and the tag in its comment. The action is pinned to a
#   release's full commit SHA, never a tag, a branch or a floating major, because it receives the organization's keys,
#   and a SHA is the one pin nobody can move.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # The engine checks a comment again (`/review`, `/review explain` or `/review teach`, from a writer) and stops
    # before any model call when it isn't one. A closed pull request goes to the outcomes job below instead, and a plain
    # `/review` on one doesn't run, so it can't cancel or displace the outcomes job, which shares its concurrency group.
    # The concurrency group below decides which comments can cancel a review.
    # A person opening, reopening or marking ready a pull request starts a review, one from a fork only when it isn't a
    # draft, and so does Dependabot opening one from the repository or pushing to its own (synchronize), so the approval
    # follows Dependabot's latest commit (ADR-0041). Another bot's pull request, and a push by anyone but Dependabot,
    # start nothing; a job its if: skips joins no concurrency group, so it cancels no review.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action != 'closed' &&
        (github.event.pull_request.head.repo.full_name == github.repository || !github.event.pull_request.draft) &&
        !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
        ((github.event.action != 'synchronize' && github.event.sender.type != 'Bot') ||
          (github.event.pull_request.user.login == 'dependabot[bot]' && github.event.sender.login == 'dependabot[bot]'))) ||
      (github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review') &&
        (github.event.issue.state == 'open' || startsWith(github.event.comment.body, '/review explain') ||
          startsWith(github.event.comment.body, '/review teach')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # Anthropic's federation rule trusts only jobs in this environment, which only the default branch can deploy to.
    environment: code-review
    timeout-minutes: 30
    # Only a comment whose first line is exactly `/review` joins the pull request's group, where a newer review cancels
    # the one in progress; lines after it, such as an agent's `---` footer, don't change that. Every other comment the
    # `if:` admits, `/review explain`, `/review teach` or any other text that starts with `/review`, gets a group of its
    # own, so a comment the engine won't act on can't cancel one it would.
    concurrency:
      group: code-review-${{ github.event_name == 'issue_comment' && !(github.event.comment.body == '/review' || startsWith(github.event.comment.body, format('/review{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('/review{0}', fromJSON('"\r\n"')))) && format('command-{0}', github.event.comment.id) || github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      # The issues a pull request closes are context for its intent, and synthesis links a finding to an open issue
      # that already tracks it.
      issues: read
      pull-requests: read
    steps:
      - name: Check out the default branch for the conventions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: Review
        uses: NCodeGroup/code-review@c88c378ad166b57027bf504526e09585e727c33c # v1.7.0
        with:
          app-private-key: ${{ secrets.NCODE_REVIEW_APP_PRIVATE_KEY }}
          bedrock-api-key: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # A review that leaves no blocker or should-fix finding open approves the pull request.
          approve: true
          # The NCode Review Approver submits the approval, so it meets the ruleset's required approval; the key is a
          # secret of the code-review environment, which only the default branch can deploy to.
          approver-private-key: ${{ secrets.NCODE_REVIEW_APPROVER_PRIVATE_KEY }}
          # Reviews a fork's pull request once it isn't a draft; it is never approved (ADR-0043).
          review-forks: true

  outcomes:
    # A closed pull request, merged or not, a fork's too, whoever closed it (a merge queue merges as a bot) and whatever
    # its labels: records what became of each finding, by rules alone. It makes no model call, so it runs outside the
    # code-review environment, without id-token: write, the Bedrock key or a checkout.
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The review's group: it waits for a review in progress, so that review's threads are counted, instead of cancelling
    # it.
    concurrency:
      group: code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record the outcomes
        uses: NCodeGroup/code-review@c88c378ad166b57027bf504526e09585e727c33c # v1.7.0
        with:
          app-private-key: ${{ secrets.NCODE_REVIEW_APP_PRIVATE_KEY }}
          review-forks: true
